name: Kaggle T4 GPU Smoke Test (1 Frame)

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Push & Poll 1-Frame Render on Kaggle T4 GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install -q kaggle six urllib3 requests python-dateutil tqdm

      - name: Configure Kaggle Token & Push T4 GPU Kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          cat > kaggle/smoke/kernel-metadata.json << EOF
          {
            "id": "${KAGGLE_USERNAME}/roblox-t4-gpu-smoke-test",
            "title": "Roblox T4 GPU Smoke Test",
            "code_file": "smoke_render.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          kaggle kernels push -p kaggle/smoke --accelerator NvidiaTeslaT4

      - name: Poll Kaggle Kernel Until Complete
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          SLUG="${KAGGLE_USERNAME}/roblox-t4-gpu-smoke-test"
          sleep 10
          FINAL_STATE="timeout"
          for i in $(seq 1 45); do
            STATUS=$(kaggle kernels status "$SLUG" 2>&1 || true)
            echo "Poll $i: $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then
              FINAL_STATE="complete"
              break
            fi
            if echo "$STATUS" | grep -qi '"error"\|KernelWorkerStatus.ERROR\|cancel'; then
              FINAL_STATE="error"
              break
            fi
            sleep 20
          done
          mkdir -p kaggle_out
          kaggle kernels output "$SLUG" -p kaggle_out || true
          ls -la kaggle_out || true
          cat kaggle_out/*.log 2>/dev/null || true
          if [ "$FINAL_STATE" != "complete" ]; then
            echo "Kernel finished with state: $FINAL_STATE"
            exit 1
          fi

      - name: Upload Kaggle Smoke Frame
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-t4-smoke-output
          path: kaggle_out/*
          retention-days: 7
